background {
    monitor =
    path = ~/Pictures/wallpapers/wallpaper.png
    color = rgba(26,27,38,1.0)  # #1a1b26 solid color
    blur_passes = 1
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 600, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(10,18,20,0.8)  # #0a1214
    outer_color = rgba(94,196,176,1.0)  # #5ec4b0
    outline_thickness = 4

    font_family = CaskaydiaMono Nerd Font
    font_color = rgba(205,214,244,1.0)

    placeholder_text =   Enter Password 󰈷 
    check_color = rgba(74,158,146,1.0)  # #4a9e92
    fail_text = Wrong

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
